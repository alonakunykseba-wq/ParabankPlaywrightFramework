name: Playwright Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and install Maven dependencies
        run: mvn -B install -DskipTests

      - name: Install Playwright Browsers and System Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Setup Local Ollama and Download Llama3.2
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & 
          sleep 10 
          ollama pull llama3.2 

      - name: Run Regression Suite with Local AI Triage
        run: mvn clean test

      - name: Upload Failure Screenshots and Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-reports
          path: target/
          if-no-files-found: ignore
